name: Autonomous AI Developer

on:
  issues:
    types: [opened, edited]

jobs:
  autonomous_code:
    if: contains(github.event.issue.labels.*.name, 'ai-build')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install google-genai

      - name: Run AI Agent Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python .github/scripts/agent_engine.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Autonomous build: Fixes #${{ github.event.issue.number }} - ${{ env.ISSUE_TITLE }}"
          title: "AI Build: Fixes #${{ github.event.issue.number }}"
          body: |
            ⚠️ **This PR was generated by the Autonomous AI Developer.**

            Review the changes carefully before merging.

            Closes #${{ github.event.issue.number }}
          labels: ai-generated
          branch: ai-build-issue-${{ github.event.issue.number }}
